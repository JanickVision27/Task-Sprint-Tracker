services:
  - type: web
    name: task-sprint-tracker-backend
    runtime: docker
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Public URL of the React app — used to build the links inside emails.
      - key: APP_FRONTEND_URL
        value: "https://task-sprint-tracker.vercel.app"
      # Brevo transactional email. Set these in the Render dashboard (they are secrets).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Task & Sprint Tracker"
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: "30"
