apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sprint-tracker-network-policy
  namespace: default
spec:
  # Selecting the backend pods makes this a default-deny policy for their other ingress/egress.
  podSelector:
    matchLabels:
      app: sprint-tracker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept API/WebSocket traffic only from frontend pods on the backend's container port.
    - from:
        - podSelector:
            matchLabels:
              app: sprint-tracker-frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Standard NetworkPolicy cannot match DNS names. This permits TCP/5432 only; narrow to Neon IP CIDRs
    # or use an FQDN-aware CNI policy (for example Cilium) for a stricter production destination allowlist.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    # Permit DNS queries only to CoreDNS pods in kube-system; adjust labels for the cluster's DNS add-on.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
