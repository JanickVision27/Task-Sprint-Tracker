spring.application.name=backend

# 1. This is the most important line. It tells Spring to read application-local.properties
spring.profiles.active=local

# 2. Common JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Temporary local-development setup: SecurityConfig permits every request, so
# Boot's fallback in-memory user is not needed and will not generate a password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
