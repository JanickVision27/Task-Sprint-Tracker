spring.application.name=backend

# Active profile (defaults to 'local' so ignored application-local.properties can be used locally).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Render and other platforms may inject PORT; otherwise listen on 8080.
server.port=${PORT:8080}

# Supply database values through environment variables or a secret manager; never commit production credentials.
# Kubernetes uses DATABASE_* names; nested fallbacks preserve existing SPRING_DATASOURCE_* deployments.
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Common JPA settings.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jmx.enabled=false

# Expose only health, suppress detailed component output, and enable Kubernetes liveness/readiness groups.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Kubernetes uses JWT_SECRET; APP_JWT_SECRET remains as a backward-compatible deployment alias.
# Use a cryptographically random value of at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET}}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# CORS Configuration (comma-separated list of allowed frontend origins).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Exclude default fallback in-memory user (we use custom JWT authentication).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Transactional email (Brevo)
# ---------------------------------------------------------------------------
# Brevo is called over its HTTPS API instead of SMTP, because free/container hosts
# (Render, Kubernetes egress policies) routinely block outbound SMTP ports.
# Create a v3 API key in Brevo -> SMTP & API -> API Keys. Never commit the real value.
app.brevo.enabled=${BREVO_ENABLED:true}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
# Sender must be verified in Brevo (Settings -> Senders & IP -> Senders), otherwise
# Brevo rejects the request with "sender not valid".
app.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.brevo.sender-name=${BREVO_SENDER_NAME:Task & Sprint Tracker}

# Public URL of the React app; used to build the links inside the emails
# (welcome -> /dashboard, reset -> /reset-password?token=...).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Password reset links are single-use and expire after this many minutes.
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
