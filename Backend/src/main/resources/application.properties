spring.application.name=backend

# Active profile (defaults to 'local' so ignored application-local.properties can be used locally).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Render and other platforms may inject PORT; otherwise listen on 8080.
server.port=${PORT:8080}

# Supply database connection values through environment variables or a secret manager.
# Do not put production credentials in this file or commit them to source control.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Common JPA settings.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jmx.enabled=false

# Expose only the health endpoint over HTTP and avoid publishing health details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Inject the JWT signing key via a secret manager/environment variable.
# Use a cryptographically random value of at least 32 bytes for HS256.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# CORS Configuration (comma-separated list of allowed frontend origins).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Exclude default fallback in-memory user (we use custom JWT authentication).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
