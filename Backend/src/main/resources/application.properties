spring.application.name=backend

# Active profile (defaults to 'local' so application-local.properties is loaded when present locally)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Port (Render injects PORT automatically)
server.port=${PORT:8080}

# Database Configuration (Set SPRING_DATASOURCE_URL / USERNAME / PASSWORD on Render, or use application-local.properties locally)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Common JPA settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jmx.enabled=false

# JWT Configuration (Set APP_JWT_SECRET on Render - must be at least 32 characters for HS256)
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:default-dev-secret-key-at-least-32-bytes-long-for-hs256}}
app.jwt.expiration=${APP_JWT_EXPIRATION:${JWT_EXPIRATION:86400000}}

# CORS Configuration (Comma-separated list of allowed frontend origins, e.g. https://your-app.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Exclude default fallback in-memory user (we use custom JWT authentication)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
