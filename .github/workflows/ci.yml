name: Backend CI

# This tells GitHub Actions when to run
on:
  push:
    branches: [ "main" ] # Run on every push to the main branch
  pull_request:
    branches: [ "main" ] # Run when a Pull Request is opened against main

jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub spins up a clean Ubuntu Linux server for us

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Downloads your repository code onto the server

      - name: Set up JDK 21
        uses: actions/setup-java@v4 # Installs Java
        with:
          java-version: '21' # Using 21, matching your project requirements
          distribution: 'temurin' # Temurin is the industry-standard open-source JDK
          cache: maven # Caches Maven dependencies so future runs are super fast

      - name: Run Tests with Maven
        run: mvn -B clean test --file backend/pom.yml 
        # -B means "Batch mode" (no interactive prompts)
        # clean test wipes old files and runs your JUnit tests
        # --file tells Maven where to find the pom.xml since it's inside the /backend folder